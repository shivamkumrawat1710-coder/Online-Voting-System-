<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Voter Dashboard</title>

    <style>
        /* ORIGINAL DESIGN */
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #dfe9f3, #ffffff);
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 240px;
            background: rgba(44, 62, 80, 0.95);
            color: white;
            height: 100vh;
            padding: 20px;
            backdrop-filter: blur(10px);
            animation: slideIn 0.8s ease;
            
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar li {
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .sidebar li:hover,
        .sidebar li.active {
            background: #34495e;
            transform: translateX(5px);
        }

        .main {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            animation: fadeIn 1s ease;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            animation: fadeUp 0.8s ease;
        }

        h1 {
            margin-bottom: 10px;
        }

        .election-card {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
        }

        .election-btn {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            background: white;
            color: #27ae60;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .vote-options {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 25px;
        }

        .vote-card {
            flex: 1;
            min-width: 220px;
            background: linear-gradient(135deg, #3498db, #2c3e50);
            color: white;
            padding: 20px;
            border-radius: 18px;
            text-align: center;
            cursor: pointer;
        }

        .vote-card img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 10px;
        }

        /* ✅ ID BADGE */
        .id-badge {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #2c3e50;
            color: white;
            padding: 10px 15px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .id-circle {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #3498db;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .id-details {
            position: absolute;
            bottom: 60px;
            left: 0;
            background: white;
            color: black;
            padding: 10px;
            border-radius: 10px;
            display: none;
        }

        .id-badge:hover .id-details {
            display: block;
        }

        /* animations */
        @keyframes slideIn {
            from {
                transform: translateX(-100%);
            }

            to {
                transform: translateX(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>Voter Panel</h2>
        <ul>
            <li class="active" onclick="showSection('home',this)">🏠 Home</li>
            <li onclick="showSection('vote',this)">🗳 Vote</li>
            <li onclick="logout()">🚪 Logout</li>
        </ul>
    </div>

    <div class="main">

        <div id="home" class="section active">
            <div class="card">
                <h1>Welcome Voter 👋</h1>
                <p>Election is live. Please cast your vote carefully.</p>
            </div>

            <div class="election-card" onclick="goToVote()">
                <h2>🔥 Active Election</h2>
                <p>Student Council Election 2026</p>
                <button class="election-btn">Go to Vote 🗳</button>
            </div>
        </div>

        <div id="vote" class="section">
            <div class="card">
                <h2>🗳 Cast Your Vote</h2>
                <div class="vote-options" id="voteContainer"></div>
            </div>
        </div>

    </div>

    <!-- ID BADGE -->
    <div class="id-badge">
        <div class="id-circle" id="initial"></div>
        <div id="username"></div>

        <div class="id-details" id="details"></div>
    </div>

    <script>

        let approved = JSON.parse(localStorage.getItem("approvedCandidates")) || [];
        let votes = JSON.parse(localStorage.getItem("votes")) || {};
        let votedUsers = JSON.parse(localStorage.getItem("votedUsers")) || [];

        let current = JSON.parse(localStorage.getItem("currentVoter"));

        // ID SET
        document.getElementById("initial").innerText = current.name.charAt(0).toUpperCase();
        document.getElementById("username").innerText = current.name;

        document.getElementById("details").innerHTML = `
<b>Name:</b> ${current.name}<br>
<b>Roll:</b> ${current.roll}
`;

        /* NAV */
        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function goToVote() { showSection('vote'); }

        function logout() {
            if (confirm("Logout?")) {
                window.location.href = "VoterLogin.html";
            }
        }

        /* LOAD */
        function loadCandidates() {
            let container = document.getElementById("voteContainer");
            container.innerHTML = "";

            approved.forEach(c => {
                if (!votes[c.name]) votes[c.name] = 0;

                container.innerHTML += `
<div class="vote-card" onclick="castVote('${c.name}')">
<img src="${c.photo}">
<h3>${c.name}</h3>
<p>${c.party}</p>
</div>`;
            });

            localStorage.setItem("votes", JSON.stringify(votes));
        }

        /* VOTE */
        function castVote(candidate) {
            if (votedUsers.includes(current.roll)) { alert("Already Voted ❌"); return; }
            votes[candidate]++; votedUsers.push(current.roll);
            localStorage.setItem("votes", JSON.stringify(votes));
            localStorage.setItem("votedUsers", JSON.stringify(votedUsers));
            alert("Vote Casted Successfully ✅");
        } loadCandidates();

    </script>

</body>

</html>
